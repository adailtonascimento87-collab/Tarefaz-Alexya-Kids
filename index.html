<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas Alexya Kids (Sincronizado Nuvem)</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --primary-color: #ff6b35;
            --primary-hover: #e85a24;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --primary-color: #ff7f50;
            --primary-hover: #ff6347;
            --shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
        }

        .theme-btn, .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .filter-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-card label {
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .form-card, .kanban-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        button.primary {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        button.primary:hover {
            background: var(--primary-hover);
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .kanban-col {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            min-height: 250px;
        }

        .kanban-col h3 {
            font-size: 0.95rem;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .task-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            position: relative;
        }

        .task-card.alert-due {
            border-left: 4px solid #ff4d4d;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-right: 5px;
            background: var(--border-color);
            color: var(--text-color);
        }

        /* Cores específicas para as etiquetas de Prioridade */
        .badge-prio-baixa {
            background-color: #28a745 !important;
            color: #ffffff !important;
        }

        .badge-prio-media {
            background-color: #ffc107 !important;
            color: #212529 !important;
        }

        .badge-prio-alta {
            background-color: #dc3545 !important;
            color: #ffffff !important;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .btn-small {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-small:hover {
            color: var(--text-color);
            border-color: var(--text-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        .category-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Tarefas Alexya Kids ☁️</h1>
        <div style="display: flex; gap: 8px;">
            <button class="settings-btn" onclick="openCatModal()">Gerir Categorias</button>
            <button class="theme-btn" onclick="toggleTheme()">🌓 Tema</button>
        </div>
    </header>

    <!-- Formulário de Nova Tarefa -->
    <div class="form-card">
        <div class="form-row">
            <input type="text" id="taskTitle" placeholder="O que precisa ser feito?">
            <select id="taskCategory"></select>
            <select id="taskPriority">
                <option value="Baixa">Prioridade baixa</option>
                <option value="Média" selected>Prioridade média</option>
                <option value="Alta">Prioridade alta</option>
            </select>
        </div>
        <div class="form-row" style="margin-top: 10px;">
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">Início:</label>
                <input type="date" id="taskStartDate">
            </div>
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">Fim (Prazo Limite):</label>
                <input type="date" id="taskEndDate">
            </div>
        </div>
        <textarea id="taskNotes" placeholder="Notas (opcional)" style="margin-top: 10px; height: 60px;"></textarea>
        <button class="primary" onclick="addTask()" style="margin-top: 10px;">Adicionar tarefa</button>
    </div>

    <!-- Barra de Filtro de Categorias -->
    <div class="filter-card">
        <label for="filterCategory">📁 Filtrar exibição:</label>
        <select id="filterCategory" onchange="renderTasks()">
            <option value="TODAS">Todas as Categorias</option>
        </select>
    </div>

    <!-- Quadro Kanban -->
    <div class="kanban-board">
        <div class="kanban-col" id="col-fazer">
            <h3>A fazer <span id="count-fazer" class="badge">0</span></h3>
            <div class="tasks-container" data-status="A fazer"></div>
        </div>
        <div class="kanban-col" id="col-andamento">
            <h3>Em andamento <span id="count-andamento" class="badge">0</span></h3>
            <div class="tasks-container" data-status="Em andamento"></div>
        </div>
        <div class="kanban-col" id="col-concluido">
            <h3>Concluído <span id="count-concluido" class="badge">0</span></h3>
            <div class="tasks-container" data-status="Concluído"></div>
        </div>
    </div>
</div>

<!-- Modal de Gestão de Categorias -->
<div class="modal" id="catModal">
    <div class="modal-content">
        <h3>Gerir Categorias</h3>
        <div style="display: flex; gap: 5px; margin-bottom: 15px;">
            <input type="text" id="newCatName" placeholder="Nova categoria...">
            <button class="primary" onclick="addCategory()" style="width: auto; padding: 0 15px;">Adicionar</button>
        </div>
        <div id="categoryListContainer"></div>
        <button class="btn-small" onclick="closeCatModal()" style="width: 100%; margin-top: 15px; padding: 8px;">Fechar</button>
    </div>
</div>

<!-- Conexão com Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCgw6zR7ZbsuNaf6r0tAGzjBM30NutvMg0",
        authDomain: "tarefas-alexya-kids.firebaseapp.com",
        projectId: "tarefas-alexya-kids",
        storageBucket: "tarefas-alexya-kids.firebasestorage.app",
        messagingSenderId: "478582481430",
        appId: "1:478582481430:web:7a9746ec8a9a69f13a4b37"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let categories = ["Fotos/Conteúdo", "Pedidos", "Estoque", "Financeiro", "Marketing"];
    let tasks = [];

    // Sincronizar Categorias em Tempo Real
    const catDocRef = doc(db, "settings", "categories");
    onSnapshot(catDocRef, (docSnap) => {
        if (docSnap.exists()) {
            categories = docSnap.data().list || categories;
        } else {
            setDoc(catDocRef, { list: categories });
        }
        updateCategoryDropdowns();
    });

    // Sincronizar Tarefas em Tempo Real
    const tasksColRef = collection(db, "tasks");
    onSnapshot(tasksColRef, (snapshot) => {
        tasks = [];
        snapshot.forEach((doc) => {
            tasks.push({ id: doc.id, ...doc.data() });
        });
        renderTasks();
    });

    // Funções Globais
    window.toggleTheme = function() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('alexya_theme', newTheme);
    }

    const savedTheme = localStorage.getItem('alexya_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    function updateCategoryDropdowns() {
        const selectTask = document.getElementById('taskCategory');
        selectTask.innerHTML = '';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            selectTask.appendChild(opt);
        });

        const selectFilter = document.getElementById('filterCategory');
        const selectedFilterValue = selectFilter.value;
        selectFilter.innerHTML = '<option value="TODAS">Todas as Categorias</option>';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            selectFilter.appendChild(opt);
        });
        selectFilter.value = selectedFilterValue || "TODAS";
    }

    window.renderTasks = function() {
        const containerFazer = document.querySelector('#col-fazer .tasks-container');
        const containerAndamento = document.querySelector('#col-andamento .tasks-container');
        const containerConcluido = document.querySelector('#col-concluido .tasks-container');

        containerFazer.innerHTML = '';
        containerAndamento.innerHTML = '';
        containerConcluido.innerHTML = '';

        let counts = { "A fazer": 0, "Em andamento": 0, "Concluído": 0 };
        const today = new Date().toISOString().split('T')[0];
        const selectedCategory = document.getElementById('filterCategory').value;

        const filteredTasks = tasks.filter(task => {
            if (selectedCategory === 'TODAS') return true;
            return task.category === selectedCategory;
        });

        filteredTasks.forEach((task) => {
            counts[task.status] = (counts[task.status] || 0) + 1;
            
            let isCloseToDeadline = false;
            if(task.endDate && task.status !== 'Concluído') {
                const diffTime = new Date(task.endDate) - new Date(today);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if(diffDays <= 2) isCloseToDeadline = true;
            }

            // Define a classe CSS baseada na prioridade da tarefa
            let prioClass = '';
            if (task.priority === 'Baixa') prioClass = 'badge-prio-baixa';
            else if (task.priority === 'Média') prioClass = 'badge-prio-media';
            else if (task.priority === 'Alta') prioClass = 'badge-prio-alta';

            const card = document.createElement('div');
            card.className = `task-card ${isCloseToDeadline ? 'alert-due' : ''}`;
            card.innerHTML = `
                <strong>${task.title}</strong>
                ${task.notes ? `<p style="font-size:0.8rem; color:var(--text-muted); margin: 5px 0;">${task.notes}</p>` : ''}
                <div style="margin-top: 8px;">
                    <span class="badge">${task.category}</span>
                    <span class="badge ${prioClass}">${task.priority}</span>
                    <span style="font-size:0.75rem; color:var(--text-muted);">📅 ${task.startDate || '--'} até ${task.endDate || '--'}</span>
                </div>
                <div class="actions-bar">
                    <select onchange="changeStatus('${task.id}', this.value)" style="font-size:0.75rem; padding:3px; width:auto;">
                        <option value="A fazer" ${task.status === 'A fazer' ? 'selected' : ''}>A fazer</option>
                        <option value="Em andamento" ${task.status === 'Em andamento' ? 'selected' : ''}>Em andamento</option>
                        <option value="Concluído" ${task.status === 'Concluído' ? 'selected' : ''}>Concluído</option>
                    </select>
                    <button class="btn-small" onclick="deleteTask('${task.id}')">Excluir</button>
                </div>
            `;

            if(task.status === 'A fazer') containerFazer.appendChild(card);
            else if(task.status === 'Em andamento') containerAndamento.appendChild(card);
            else containerConcluido.appendChild(card);
        });

        document.getElementById('count-fazer').textContent = counts["A fazer"] || 0;
        document.getElementById('count-andamento').textContent = counts["Em andamento"] || 0;
        document.getElementById('count-concluido').textContent = counts["Concluído"] || 0;
    }

    window.addTask = async function() {
        const title = document.getElementById('taskTitle').value.trim();
        if(!title) return alert('Por favor, digite o título da tarefa.');

        const newTask = {
            title: title,
            category: document.getElementById('taskCategory').value,
            priority: document.getElementById('taskPriority').value,
            startDate: document.getElementById('taskStartDate').value,
            endDate: document.getElementById('taskEndDate').value,
            notes: document.getElementById('taskNotes').value.trim(),
            status: 'A fazer'
        };

        await addDoc(tasksColRef, newTask);

        document.getElementById('taskTitle').value = '';
        document.getElementById('taskNotes').value = '';
        document.getElementById('taskStartDate').value = '';
        document.getElementById('taskEndDate').value = '';
    }

    window.changeStatus = async function(id, newStatus) {
        const taskDoc = doc(db, "tasks", id);
        await updateDoc(taskDoc, { status: newStatus });
    }

    window.deleteTask = async function(id) {
        if(confirm('Deseja excluir esta tarefa?')) {
            const taskDoc = doc(db, "tasks", id);
            await deleteDoc(taskDoc);
        }
    }

    window.openCatModal = function() {
        renderCategoryList();
        document.getElementById('catModal').style.display = 'flex';
    }

    window.closeCatModal = function() {
        document.getElementById('catModal').style.display = 'none';
        updateCategoryDropdowns();
    }

    function renderCategoryList() {
        const container = document.getElementById('categoryListContainer');
        container.innerHTML = '';
        categories.forEach((cat, index) => {
            const row = document.createElement('div');
            row.className = 'category-list-item';
            row.innerHTML = `
                <input type="text" value="${cat}" id="cat-input-${index}" style="margin-right: 5px;">
                <button class="btn-small" onclick="renameCategory(${index})">Salvar</button>
                <button class="btn-small" onclick="deleteCategory(${index})" style="color: #ff4d4d; border-color: #ff4d4d;">X</button>
            `;
            container.appendChild(row);
        });
    }

    window.addCategory = async function() {
        const name = document.getElementById('newCatName').value.trim();
        if(name && !categories.includes(name)) {
            categories.push(name);
            document.getElementById('newCatName').value = '';
            await setDoc(catDocRef, { list: categories });
            renderCategoryList();
        }
    }

    window.renameCategory = async function(index) {
        const newName = document.getElementById(`cat-input-${index}`).value.trim();
        if(newName) {
            categories[index] = newName;
            await setDoc(catDocRef, { list: categories });
            renderCategoryList();
        }
    }

    window.deleteCategory = async function(index) {
        if(categories.length <= 1) return alert('Você precisa manter pelo menos uma categoria.');
        categories.splice(index, 1);
        await setDoc(catDocRef, { list: categories });
        renderCategoryList();
    }
</script>

</body>
</html>
